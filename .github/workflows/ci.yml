name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        # Runs on bare Node's own test runner — no framework, no transpile
        # step, and therefore nothing between a failing assertion and the log.
        run: npm test
      - name: Types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
