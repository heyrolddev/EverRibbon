name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        # Bare Node's own runner — no framework, no transpile step, and so
        # nothing between a failing assertion and the log.
        run: npm test
      - name: Types
        # `npm run typecheck` runs `next typegen` first on purpose. LayoutProps
        # and PageProps are globals Next writes into .next/types, so a bare tsc
        # on a fresh checkout fails on every typed route — which passed locally
        # only because a build had already happened.
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  schema:
    # A migration that does not run is not a migration. This loads the whole
    # baseline into a real Postgres on every push, so a schema that cannot be
    # applied is a red build rather than a bad evening during a deploy.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Load the baseline and check what must hold
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: node scripts/check-schema.mjs
